
name: Build Duite Gatut Wijayanto APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Apply app name and custom launcher icon
        run: |
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">Duite Gatut Wijayanto</string>|' android/app/src/main/res/values/strings.xml

          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-$d"
            cp "android-res/mipmap-$d/ic_launcher.png" "android/app/src/main/res/mipmap-$d/ic_launcher.png"
            cp "android-res/mipmap-$d/ic_launcher_round.png" "android/app/src/main/res/mipmap-$d/ic_launcher_round.png"
          done

      - name: Sync web app
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Duite-Gatut-Wijayanto-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
